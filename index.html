<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <span class="theme-icon">☀️</span>
  </button>

  <div class="app-wrapper">
    <div class="calculator" id="calculator">

      <!-- Header -->
      <div class="calc-header">
        <span class="calc-label">CALC</span>
        <span class="calc-version">v2</span>
      </div>

      <!-- Display -->
      <div class="display-section">
        <div class="expression-line" id="expressionLine">0</div>
        <div class="result-line" id="resultLine"></div>
      </div>

      <!-- History panel (collapsible) -->
      <div class="history-panel" id="historyPanel">
        <div class="history-header">
          <span>History</span>
          <button class="history-clear-btn" id="clearHistory">Clear</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="history-empty">No calculations yet.</p>
        </div>
      </div>

      <!-- History toggle -->
      <button class="history-toggle" id="historyToggle" aria-label="Toggle history">
        <span>▾ History</span>
      </button>

      <!-- Buttons grid -->
      <div class="btn-grid">

        <!-- Row 1 -->
        <button class="btn btn-fn btn-clear" data-action="clear">C</button>
        <button class="btn btn-fn" data-action="toggleSign">+/−</button>
        <button class="btn btn-fn" data-action="percent">%</button>
        <button class="btn btn-op" data-op="÷">÷</button>

        <!-- Row 2 -->
        <button class="btn btn-num" data-num="7">7</button>
        <button class="btn btn-num" data-num="8">8</button>
        <button class="btn btn-num" data-num="9">9</button>
        <button class="btn btn-op" data-op="×">×</button>

        <!-- Row 3 -->
        <button class="btn btn-num" data-num="4">4</button>
        <button class="btn btn-num" data-num="5">5</button>
        <button class="btn btn-num" data-num="6">6</button>
        <button class="btn btn-op" data-op="−">−</button>

        <!-- Row 4 -->
        <button class="btn btn-num" data-num="1">1</button>
        <button class="btn btn-num" data-num="2">2</button>
        <button class="btn btn-num" data-num="3">3</button>
        <button class="btn btn-op" data-op="+">+</button>

        <!-- Row 5 -->
        <button class="btn btn-num btn-zero" data-num="0">0</button>
        <button class="btn btn-num" data-num=".">.</button>
        <button class="btn btn-fn btn-del" data-action="delete">⌫</button>
        <button class="btn btn-eq" data-action="equals">=</button>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
